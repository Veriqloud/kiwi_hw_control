# Size-based rotation for qline node logs in /home/vq-user/log/*.log.
#
# Why root: the service logs (gc/node/kms/mon/hw/hws/rng/decoy_rng/webinterface/
# restartd) are written via systemd `StandardOutput=append:`, and systemd opens
# those files as ROOT before dropping to User=vq-user -- so they are root:root 0644
# and vq-user cannot truncate them. vq-user also has no general sudo (only
# /usr/sbin/shutdown is NOPASSWD), so this rotation must be run by root.
#
# Why copytruncate: every writer here holds the log's append fd open for the
# life of the process and never reopens it -- the systemd services (O_APPEND) and
# the cron loggers (fifo/wrs/counts/logd/autotune). A rename-based rotation would
# leave them writing to the old (now-rotated) inode. copytruncate copies the file
# then truncates it in place, so the held fd stays valid and (being O_APPEND)
# resumes writing at offset 0. Small risk: log lines written during the
# copy->truncate window are lost -- acceptable for these operational logs.
#
# Deployed to /home/vq-user/server/qline_logrotate.conf; run hourly by root via
# /etc/cron.d/qline-logrotate with its OWN state file, so it does not overlap with
# the distro's daily logrotate (this config is intentionally NOT in
# /etc/logrotate.d/). See deployment/OS_setup.md.
#
# Why NO delaycompress (removed 2026-07-28): delaycompress leaves the most-recent
# rotated copy uncompressed for operator convenience, but it strands that copy
# forever if the log then goes quiet -- rotation is purely size-based, so a log
# that never again reaches 100M never triggers the deferred gzip. This bit us:
# during the 2026-07-24 gc DMA-desync incident gc-alice logged "got 0 clicks from
# Bob" in a ~1us loop (~100 MB/s), so gc.log went from 100M to 132 GB inside one
# hourly window; the rotation captured all 132 GB into an uncompressed gc.log.1
# that then sat there indefinitely eating 28% of the root filesystem. Compressing
# in the same run costs one gzip pass but bounds the worst case. Read the newest
# rotated log with `zcat foo.log.1.gz` instead of `cat foo.log.1`.

# Directives below: size 100M = rotate a file only once it exceeds 100 MB;
# rotate 7 = keep 7 old copies; maxage 30 = also delete rotated copies older than
# 30 days, so a burst of noisy rotations cannot pin old junk indefinitely;
# compress = gzip rotated copies immediately (see delaycompress note above);
# missingok = no error if a log is absent; notifempty = skip empty logs;
# copytruncate = copy-then-truncate in place (see rationale above). Inline
# trailing comments break logrotate's parser, so keep comments on their own lines.
# su root root: ~/log is owned by vq-user and is group-writable, and the fileset
# mixes root-owned (systemd) and vq-user-owned (cron logger) files. logrotate
# refuses a non-root-owned/group-writable log dir unless told which user to rotate
# as; we must be root to truncate the root-owned logs, so rotate as root:root.
/home/vq-user/log/*.log {
    su root root
    size 100M
    rotate 7
    maxage 30
    compress
    missingok
    notifempty
    copytruncate
}
