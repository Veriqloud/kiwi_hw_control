[package]
name = "gen_config"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1.0.132"
serde = { version = "1.0.213", features = ["derive"] }
clap = { version = "4.5.32", features = ["derive"] }
libp2p = { version = "0.56", features = ["identify", "rsa"] }

gc = {path = "../../gc"}
qber = {path = "../../qber"}

# node, kms (km-server) and hw_sim all live in the private qline_backend repo now:
# hw_sim is a public project, but its authoritative copy has been vendored into
# qline_backend (see qline_backend/hw_sim/README.md) and the detector model it grew
# there — dead_time, dark_count_probability, afterpulse, software_filter, speedup — is
# on no public Veriqloud/hw_sim branch, so a git dependency on public master would
# silently drop all of those fields when sim_config.json is round-tripped.
#
# To keep this repo's default build self-contained and free of private dependencies,
# gen_config builds against vendored copies of their config types (the public "struct
# database" in ./vendor). See vendor/README.md. src/lib.rs aliases these crates to
# `node` / `km_server_configs` / `simulator_configs`, so src/config.rs is identical
# whether built against the vendored or the real crates.
#
# The maintainer-only drift check against the real private repos lives in a separate
# manifest (./upstream_check/Cargo.toml) so the private paths never enter this build's
# dependency resolution. See upstream_check/README.md.
node_vendored = { path = "vendor/node", package = "node-vendored" }
km_server_vendored = { path = "vendor/km_server_configs", package = "km-server-vendored" }
# Revert this one to the plain git dependency on Veriqloud/hw_sim once the detector
# model lands on its master:
#   simulator_configs = { git = "ssh://git@github.com/Veriqloud/hw_sim.git", branch = "master", package = "configs" }
simulator_configs_vendored = { path = "vendor/simulator_configs", package = "simulator-configs-vendored" }

[features]
# Selects the real private node/kms/hw_sim crates in src/lib.rs instead of the vendored
# copies. This manifest intentionally carries NO upstream dependencies (they would
# break the self-contained default build), so this entry only registers the cfg
# name. The actual drift check is run via the separate ./upstream_check/Cargo.toml.
upstream = []





